syntax = "proto3";
option csharp_namespace = "TurnTimer";

service PawnService {
  // Bi-directional stream for real-time messaging
  rpc GetPawn(google.protobuf.Empty) returns (stream TurnMessage);
  rpc GetCurrentTurn(google.protobuf.Empty) returns (TurnMessage);
}

message GetPawnResponse {
  string id = 1;
  string text = 2;
}