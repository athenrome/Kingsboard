syntax = "proto3";
option csharp_namespace = "GrpcBoard";

import "google/protobuf/empty.proto";

// The game board: a 3D grid of map tiles owned by the server. Tiles stack on top of each other
// in columns. Clients only ever read it; the server changes tiles as the game plays out and
// streams the changes to everyone.
//
// Positions on the board are always a BoardPosition (x, y, z), all starting at 0:
//   x - column across the board (0 = left)
//   y - row into the board (0 = front)
//   z - level in a stack (0 = bottom)
// A position may hold a tile or be empty space.
// Every stack is solid from z = 0 up to its top tile: there are never gaps or floating tiles.
service BoardService {
  // Server stream of board events. The first event is always a full `board` snapshot
  // (once the game has created the board), followed by `tiles_changed` updates.
  // A new `board` snapshot is sent whenever the board is recreated (e.g. a new game);
  // it replaces everything the client had.
  rpc JoinBoardStream(google.protobuf.Empty) returns (stream BoardEvent);

  // One-off query for the whole board. Errors:
  //   UNAVAILABLE - the game hasn't created a board yet
  rpc GetBoard(google.protobuf.Empty) returns (BoardState);
}

enum TileType {
  TILE_TYPE_UNSPECIFIED = 0;
  TILE_TYPE_WATER = 1;    // Impassable
  TILE_TYPE_PLAINS = 2;
  TILE_TYPE_FOREST = 3;
  TILE_TYPE_HILLS = 4;
  TILE_TYPE_MOUNTAIN = 5; // Impassable
  TILE_TYPE_STONE = 6;    // Bedrock that fills a stack below its surface tile
}

// A position on the board. It may hold a tile or be empty space.
message BoardPosition {
  int32 x = 1;
  int32 y = 2;
  int32 z = 3;
}

message Tile {
  reserved 1, 2, 5; // Old x, y, z fields: now `position`
  BoardPosition position = 6;
  TileType type = 3;
  bool passable = 4; // Whether pawns can stand on this tile when it's the top of its stack
}

message BoardState {
  string board_id = 1; // Changes when the board is recreated
  int64 version = 2;   // Goes up by one with every change to the board
  int32 width = 3;     // Number of columns (x)
  int32 depth = 4;     // Number of rows (y)
  int32 height = 6;    // Most tiles a stack can hold (z)
  // Every tile on the board, in no particular order. Positions with no tile are empty space.
  repeated Tile tiles = 5;
}

message TilesChanged {
  string board_id = 1;
  int64 version = 2;                   // The board version after this change
  repeated Tile tiles = 3;             // Tiles placed or replaced: put these on the board
  repeated BoardPosition removed = 4;  // Tiles taken off the board: these positions are now empty space
}

message BoardEvent {
  oneof payload {
    BoardState board = 1;           // Full snapshot: replace the whole board
    TilesChanged tiles_changed = 2; // Some tiles changed: apply just these
  }
}
